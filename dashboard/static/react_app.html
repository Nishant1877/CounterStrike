<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VORTEXA 3.0 | Innovation Platform</title>
    <script type="module" crossorigin src="/assets/index-BaJfOEeN.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bwij3P3T.css">
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <div id="liveRadarToastContainer" style="position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;"></div>
    <script>
      (function() {
        const es = new EventSource('/api/stream/events');
        es.addEventListener('decision', function(e) {
          try {
            const data = JSON.parse(e.data).data;
            const container = document.getElementById('liveRadarToastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            const isDanger = data.response === 'revoke' || data.response === 'refused_session_revoked';
            const isWarn = data.response === 'step_up';
            toast.style.cssText = "pointer-events:auto;background:rgba(15,23,42,0.95);backdrop-filter:blur(10px);border:1px solid " + (isDanger ? '#f43f5e' : isWarn ? '#f59e0b' : '#38bdf8') + ";color:#fff;padding:12px 16px;border-radius:8px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.5);font-family:system-ui,sans-serif;font-size:12px;display:flex;align-items:center;gap:10px;transition:all 0.3s ease;animation:slideIn 0.3s ease-out;";
            toast.innerHTML = '<span style="font-size:16px;">' + (isDanger ? '🛑' : isWarn ? '⚠️' : '🛡️') + '</span>' +
              '<div><div style="font-weight:700;letter-spacing:0.05em;color:' + (isDanger ? '#fb7185' : isWarn ? '#fcd34d' : '#38bdf8') + '">LIVE ATTACK RADAR: ' + (data.response || 'NO_ACTION').toUpperCase() + '</div>' +
              '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">User: <b>' + data.user + '</b> | Action: <b>' + (data.action || 'event') + '</b> | Loc: <b>' + (data.location_label || 'Geo') + '</b></div>' +
              '<div style="font-size:10px;color:#cbd5e1;margin-top:2px;max-width:320px;">' + (data.explanation || '') + '</div></div>';
            container.appendChild(toast);
            setTimeout(() => {
              toast.style.opacity = '0';
              toast.style.transform = 'translateY(10px)';
              setTimeout(() => toast.remove(), 300);
            }, 5000);
          } catch(err) {}
        });
      })();
    </script>
  </body>
</html>
